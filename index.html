<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Comida Congelada en Mendoza | Cocina Gourmet</title>
<meta name="description" content="Pizzas, empanadas y viandas congeladas en Mendoza. Pedí por WhatsApp.">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body { background:#0f172a; color:white; font-family:sans-serif; padding-bottom:90px;}
.btn { background:#10b981; padding:10px; border-radius:10px; font-weight:bold; }
.img-container { position:relative; padding-top:70%; overflow:hidden; border-radius:12px;}
.img-container img { position:absolute; width:100%; height:100%; object-fit:cover;}

.cart-sidebar { transform: translateX(100%); transition: 0.3s; }
.cart-sidebar.open { transform: translateX(0); }
</style>
</head>

<body>

<!-- NAV -->
<div class="flex justify-between items-center p-4 bg-slate-900">
<input id="search" onkeyup="buscar()" placeholder="Buscar..." class="px-3 py-2 rounded text-black w-1/2">
<div class="flex gap-3">
<button onclick="toggleCart()">🛒</button>
<button onclick="login()">⚙️</button>
</div>
</div>

<!-- HERO -->
<div class="text-center p-4">
<h1 class="text-2xl font-bold">🍕 Comida lista en 5 minutos</h1>
<p class="text-sm">Freezer lleno = semana resuelta</p>
</div>

<!-- COMBOS -->
<div class="p-4">
<h2 class="text-lg font-bold text-green-400 mb-2">🔥 Combos</h2>

<div class="grid grid-cols-2 gap-3">

<div class="bg-slate-800 p-3 rounded">
<h3 class="font-bold text-sm">Combo Freezer</h3>
<p class="text-xs">3 pizzas + 2 empanadas</p>
<p class="text-green-400 font-bold">$97.000</p>
<button onclick="combo1()" class="btn w-full text-xs">Agregar</button>
</div>

<div class="bg-slate-800 p-3 rounded">
<h3 class="font-bold text-sm">Combo Familiar</h3>
<p class="text-xs">2 pizzas + 2 tartines individuales</p>
<p class="text-green-400 font-bold">$75.000</p>
<button onclick="combo2()" class="btn w-full text-xs">Agregar</button>
</div>

</div>
</div>

<!-- PRODUCTOS -->
<div id="productos" class="grid grid-cols-2 gap-3 p-4"></div>

<!-- CARRITO -->
<div id="cart" class="cart-sidebar fixed right-0 top-0 h-full w-full bg-slate-900 z-50 p-4 overflow-y-auto">
<h2 class="text-xl font-bold mb-4">🛒 Mi Pedido</h2>

<div id="cart-items"></div>

<p class="mt-4 font-bold text-green-400">
Total: $<span id="total">0</span>
</p>

<button onclick="finalizar()" class="btn w-full mt-4">
Finalizar pedido
</button>
</div>

<!-- BOTON FIJO -->
<div class="fixed bottom-0 left-0 w-full bg-slate-900 p-3">
<button onclick="toggleCart()" class="btn w-full">
🛒 Ver pedido / Comprar
</button>
</div>

<!-- WHATSAPP -->
<a href="#" onclick="openWhatsApp('Hola quiero hacer un pedido')" class="fixed bottom-20 right-5 bg-green-500 p-3 rounded-full text-xl">
💬
</a>

<script>

const WHATSAPP = "5492616668454";
const ADMIN_PASSWORD = "CG2026segura";

let products = [];
let cart = [];

const sb = supabase.createClient(
"https://peoimydvofprzemjvyzg.supabase.co",
"sb_publishable_pq5tsxdZqiNJxiQg7R6YpQ_vshWWv7H"
);

// CARGAR PRODUCTOS
async function cargar(){
let {data} = await sb.from("products").select("*");
products = data || [];
render(products);
}
cargar();

// RENDER
function render(lista){
let html = "";

lista.forEach(p=>{

html += `
<div class="bg-slate-800 p-3 rounded flex flex-col">

<div class="img-container mb-2">
<img src="${p.image_url || ''}">
</div>

<h3 class="font-bold text-xs">${p.name}</h3>

${p.name.toLowerCase().includes("tartin") 
? `<p class="text-xs text-gray-400">Porción individual</p>` : ""}

<p class="text-green-400 font-bold text-sm">$${p.price}</p>

<div class="grid grid-cols-2 gap-2 mt-auto">
<button onclick="consultar('${p.name}')" class="border p-2 text-xs rounded">
Comprar
</button>
<button onclick="add('${p.id}')" class="btn text-xs">
Agregar
</button>
</div>

</div>
`;
});

document.getElementById("productos").innerHTML = html;
}

// BUSCAR
function buscar(){
let v = document.getElementById("search").value.toLowerCase();
let filtrado = products.filter(p => p.name.toLowerCase().includes(v));
render(filtrado);
}

// AGREGAR
function add(id){
let p = products.find(x=>x.id==id);
cart.push(p);
renderCart();
}

// RENDER CARRITO
function renderCart(){
let html = "";
let total = 0;

cart.forEach(i=>{
total += parseFloat(i.price);
html += `<p class="text-sm">${i.name} - $${i.price}</p>`;
});

document.getElementById("cart-items").innerHTML = html;
document.getElementById("total").innerText = total;
}

// TOGGLE
function toggleCart(){
document.getElementById("cart").classList.toggle("open");
}

// COMBOS
function combo1(){products.slice(0,5).forEach(p=>cart.push(p));renderCart();}
function combo2(){products.slice(0,4).forEach(p=>cart.push(p));renderCart();}

// WHATSAPP
function openWhatsApp(texto){
window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(texto)}`);
}

function consultar(nombre){
openWhatsApp("Hola quiero comprar " + nombre);
}

// FINALIZAR
function finalizar(){
let msg = "Hola quiero este pedido:%0A";
cart.forEach(i=>msg += i.name + "%0A");
openWhatsApp(msg);
}

// ADMIN
function login(){
let pass = prompt("Contraseña admin:");
if(pass === ADMIN_PASSWORD){
alert("Acceso correcto");
}else{
alert("Contraseña incorrecta");
}
}

</script>

</body>
</html>
